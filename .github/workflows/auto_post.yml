name: auto_post

on:
  schedule:
    # JST 07:30 = UTC 22:30（前日） → 朝の候補補充
    - cron: "30 22 * * *"
    # JST 08:00 = UTC 23:00（前日） → 朝投稿（Reels）
    - cron: "0 23 * * *"
    # JST 09:00 = UTC 00:00 → Meta トークン残日数チェック
    - cron: "0 0 * * *"
    # JST 12:00 = UTC 03:00 → インサイト収集（engagement取得）
    - cron: "0 3 * * *"
    # JST 18:00 = UTC 09:00 → 夜投稿（Reels）
    - cron: "0 9 * * *"
    # NOTE: 両方の publish_reel が Reels 投稿 (1日2本)
  workflow_dispatch:
    inputs:
      mode:
        description: "mode: auto_source / evaluate / publish / publish_reel / check_token / collect_insights"
        required: true
        default: "publish"

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google service account JSON
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$SA_JSON" > service_account.json
          python -c "import json; d=json.load(open('service_account.json')); print('SA OK:', d['client_email'])"

      - name: Determine mode from cron
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "30 22 * * *" ]; then
            MODE="auto_source"
          elif [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            MODE="check_token"
          elif [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            MODE="collect_insights"
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            MODE="publish_reel"
          elif [ "${{ github.event.schedule }}" = "0 23 * * *" ]; then
            MODE="publish_reel"
          else
            MODE="publish"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "selected mode: $MODE"

      - name: Run orchestrator
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ./service_account.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          DEFAULT_HASHTAGS: ${{ secrets.DEFAULT_HASHTAGS }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UNSPLASH_QUERIES: ${{ secrets.UNSPLASH_QUERIES }}
          UNSPLASH_PER_QUERY: ${{ secrets.UNSPLASH_PER_QUERY }}
          AUTO_SOURCE_MAX_APPROVE: ${{ secrets.AUTO_SOURCE_MAX_APPROVE }}
          TIMEZONE: Asia/Tokyo
        run: python main.py --mode ${{ steps.mode.outputs.mode }}

      - name: Cleanup secrets
        if: always()
        run: rm -f service_account.json
